name: Flutter APK

on:
  push:
    branches: [ main, 'feat/**' ]
    paths:
      - 'flutter_prototype/**'
      - '.github/workflows/flutter-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_prototype
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: finance-flutter-apk
          path: flutter_prototype/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
